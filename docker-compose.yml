services:
  discord-docker-updater:
    build:
      context: .
      dockerfile: src/DiscordDockerUpdater/Dockerfile
    container_name: discord-docker-updater
    restart: unless-stopped
    ports:
      - "8080:8080" # For diun webhook + SignalR agent hub
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Docker socket for container inspection + compose commands
    environment:
      - Bot__DiscordToken=${DISCORD_TOKEN}
      - Bot__ChannelId=${DISCORD_CHANNEL_ID}
      - Bot__WebhookToken=${WEBHOOK_TOKEN}
      # - Bot__AgentToken=${AGENT_TOKEN}  # Shared token for agent authentication
      # - Bot__LogoUrl=https://raw.githubusercontent.com/yourusername/discord-docker-updater/main/assets/logo.png

  diun:
    image: crazymax/diun:latest
    command: serve
    depends_on:
      - discord-docker-updater
    volumes:
      - "./diun-data:/data"
      - "/var/run/docker.sock:/var/run/docker.sock"
    environment:
      - "TZ=Australia/Sydney"
      - "DIUN_WATCH_WORKERS=20"
      - "DIUN_WATCH_SCHEDULE=0 */6 * * *"
      - "DIUN_WATCH_JITTER=30s"
      - "DIUN_PROVIDERS_DOCKER=true"
      - "DIUN_NOTIF_WEBHOOK_ENDPOINT=http://discord-docker-updater:8080/webhook/diun"
      - "DIUN_NOTIF_WEBHOOK_METHOD=POST"
      - "DIUN_NOTIF_WEBHOOK_HEADERS_Content-Type=application/json"
      - "DIUN_NOTIF_WEBHOOK_HEADERS_Authorization=Bearer ${WEBHOOK_TOKEN}"
      - "DIUN_NOTIF_WEBHOOK_TIMEOUT=10s"
      - "DIUN_DEFAULTS_INCLUDETAGS=latest,nightly"
    labels:
      - "diun.enable=true"
    restart: always
